[package]
name = "lingomate-windows"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "lingomate_tsf"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole",
    "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "lingomate-fixture"
path = "tests/support/fixture.rs"
