[package]
name = "lingomate-windows"
version = "0.1.24"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "lingomate_tsf"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_System_WinRT", "UI_ViewManagement",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole",
    "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
    "Win32_Networking_WinHttp", "Win32_Security_Credentials", "Win32_System_Pipes",
    "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx",
    "Win32_System_Console", "Win32_System_JobObjects",
    "Win32_Security_Authorization",
    "Win32_System_Com_StructuredStorage",
] }

[[bin]]
name = "lingomate-fixture"
path = "tests/support/fixture.rs"

[[bin]]
name = "lingomate-desktop"
path = "src/desktop_main.rs"
