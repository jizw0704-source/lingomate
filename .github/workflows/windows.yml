name: Windows native checks
on:
  workflow_dispatch:
  push:
    paths:
      - '.gitattributes'
      - 'native-windows/src/**'
      - 'native-windows/tests/**'
      - 'native-windows/tools/**'
      - 'native-windows/packaging/**'
      - 'native-windows/Cargo.*'
      - 'native-windows/build.rs'
      - 'prototype/bridge/**'
      - 'prototype/tests/engine_test.py'
      - 'prototype/tests/memory_test.py'
      - 'prototype/tests/ranking_test.py'
      - 'updates/**'
      - 'docs/licenses/**'
      - 'data/source.json'
      - 'data/frequency-source.json'
      - 'data/pos-source.json'
      - 'data/ranking.json'
      - 'tools/prepare_lexicon.py'
      - 'tools/frequency.py'
      - 'tools/part_of_speech.py'
      - 'tools/test_part_of_speech.py'
      - 'tools/test_frequency.py'
      - 'tools/test_prepare_lexicon.py'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - '.gitattributes'
      - 'native-windows/src/**'
      - 'native-windows/tests/**'
      - 'native-windows/tools/**'
      - 'native-windows/packaging/**'
      - 'native-windows/Cargo.*'
      - 'native-windows/build.rs'
      - 'prototype/bridge/**'
      - 'prototype/tests/engine_test.py'
      - 'prototype/tests/memory_test.py'
      - 'prototype/tests/ranking_test.py'
      - 'updates/**'
      - 'docs/licenses/**'
      - 'data/source.json'
      - 'data/frequency-source.json'
      - 'data/pos-source.json'
      - 'data/ranking.json'
      - 'tools/prepare_lexicon.py'
      - 'tools/frequency.py'
      - 'tools/part_of_speech.py'
      - 'tools/test_part_of_speech.py'
      - 'tools/test_frequency.py'
      - 'tools/test_prepare_lexicon.py'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check updater under both PowerShell runtimes and render its window
        shell: pwsh
        run: ./native-windows/tools/check-updates.ps1
      - name: Prepare fixed source and toolchain
        shell: pwsh
        run: ./native-windows/tools/setup.ps1
      - name: Build native DLL and shared engine
        shell: pwsh
        run: ./native-windows/tools/build.ps1
      - name: Check scripts, formatting, lint, real engine and DLL lifetime
        shell: pwsh
        run: ./native-windows/tools/check.ps1 -SkipUpdates
      - name: Check embedded icon and render isolated candidate windows
        shell: pwsh
        run: ./native-windows/tools/test-appearance.ps1 -Dll "$PWD/native-windows/package/windows-x64/lingomate_tsf.dll" -OutputDirectory "$PWD/native-windows/package"
      - name: Render isolated offline learning windows
        shell: pwsh
        run: ./native-windows/tools/test-learning-window.ps1 -Dll "$PWD/native-windows/package/windows-x64/lingomate_tsf.dll" -OutputDirectory "$PWD/native-windows/package"
      - name: Compile local installer and inspect initial window without installing
        shell: pwsh
        run: |
          ./native-windows/tools/build-installer.ps1
          $Installer = Get-ChildItem native-windows/package/installer-*/*-setup.exe | Select-Object -First 1
          ./native-windows/tools/test-installer-window.ps1 -Installer $Installer.FullName -Output "$PWD/native-windows/package/installer-preview.png"
      - name: Save isolated update window preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-update-ui
          path: |
            native-windows/package/update-preview*.png
            native-windows/package/installer-preview.png
            native-windows/package/learning-preview-*.png
            native-windows/package/candidate-preview-*.png
            native-windows/package/input-icon.png
          retention-days: 7
      # Full dictionaries and local install packages are not published by this workflow.
